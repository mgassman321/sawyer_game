  <style>
    :root {
      --paper:  light-dark(#faf9f6, #191a18);
      --ink:    light-dark(#222620, #eeeeea);
      --quiet:  light-dark(#6f746b, #a5aa9f);
      --rule:   light-dark(#dedfd7, #383d34);
      --accent: #6f8259;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); }
    body {
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 36px 48px 24px;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { font-size: 23px; font-weight: 500; letter-spacing: -1px; }
    .dot { color: var(--accent); }
    .detail { font-size: 11px; color: var(--quiet); }

    main { flex: 1; }
    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 56px;
    }
    .tagline {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: var(--quiet);
    }
    .slashes { color: var(--accent); margin-right: 2px; }
    .taglines { display: flex; flex-direction: column; gap: 3px; }
    h1 {
      margin: 0 0 18px;
      font-size: 40px;
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -2px;
    }

    /* ---------- Project grid ---------- */
    .grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px 22px;
    }
    .project {
      display: block;
      color: inherit;
      text-decoration: none;
    }
    .project:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .preview {
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tile);
    }
    /* Each icon is a white PNG used as a mask, so it takes the tile's logo color
       in both light and dark mode. */
    .logo {
      width: var(--size, 78px);
      height: var(--size, 78px);
      background: var(--mark);
      -webkit-mask: var(--icon) center / contain no-repeat;
              mask: var(--icon) center / contain no-repeat;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 12px;
      font-size: 12px;
    }
    .caption svg {
      flex-shrink: 0;
      width: 14px; height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: color .15s ease;
    }
    .project:hover .caption span { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
    .project:hover .caption svg,
    .project:focus-visible .caption svg { color: var(--accent); }

    .privacy-note a { color: inherit; text-underline-offset: 2px; text-decoration-color: var(--rule); }
    .privacy-note a:hover { color: var(--ink); text-decoration-color: var(--accent); }
