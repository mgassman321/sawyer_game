<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicons/spectrum.png">
<link rel="apple-touch-icon" href="favicons/spectrum-touch.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrum Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --panel-bg: rgba(8,6,18,0.95);
  --panel-border: rgba(255,255,255,0.08);
  --accent: #a060ff;
  --accent-glow: rgba(160,96,255,0.25);
  --text: rgba(255,255,255,0.75);
  --text-dim: rgba(255,255,255,0.3);
  --mono: 'Share Tech Mono','Courier New',monospace;
}
body { background:#000; overflow:hidden; font-family:var(--mono); color:var(--text); }

#topbar {
  position:fixed; top:0; left:0; right:0; height:48px;
  background:var(--panel-bg); border-bottom:1px solid var(--panel-border);
  display:flex; align-items:center; padding:0 18px; gap:10px; z-index:20;
}
.logo { font-size:13px; letter-spacing:0.25em; color:var(--accent); }
.divx { width:1px; height:22px; background:var(--panel-border); flex-shrink:0; }
.src-btn {
  background:transparent; border:1px solid rgba(255,255,255,0.15);
  color:var(--text); padding:5px 13px; border-radius:4px; cursor:pointer;
  font-size:10px; font-family:var(--mono); letter-spacing:0.1em;
  text-transform:uppercase; transition:all 0.15s; white-space:nowrap;
}
.src-btn:hover { border-color:var(--accent); color:var(--accent); }
.src-btn.active { border-color:#60ff90; color:#60ff90; background:rgba(96,255,144,0.07); }

#status-area { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:0.1em; color:var(--text-dim); }
#dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.3s; }
#dot.on { background:#60ff90; box-shadow:0 0 7px #60ff90; animation:pulse 1.8s infinite; }
#dot.err { background:#ff5555; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
#panel-toggle {
  font-size:10px; letter-spacing:0.1em; color:var(--text-dim); cursor:pointer;
  padding:5px 10px; border:1px solid var(--panel-border); border-radius:4px;
  transition:all 0.15s; user-select:none; white-space:nowrap;
}
#panel-toggle:hover { border-color:rgba(255,255,255,0.3); color:var(--text); }

#canvas-wrap { position:fixed; top:48px; left:0; right:280px; bottom:0; transition:right 0.3s; }
#canvas-wrap.full { right:0; }
canvas { display:block; width:100%; height:100%; }

#panel {
  position:fixed; top:48px; right:0; bottom:0; width:280px;
  background:var(--panel-bg); border-left:1px solid var(--panel-border);
  overflow-y:auto; z-index:15; transition:transform 0.3s;
  scrollbar-width:thin; scrollbar-color:rgba(160,96,255,0.3) transparent;
}
#panel.hidden { transform:translateX(100%); }
#panel::-webkit-scrollbar { width:4px; }
#panel::-webkit-scrollbar-thumb { background:rgba(160,96,255,0.3); border-radius:2px; }

.sec { border-bottom:1px solid var(--panel-border); padding:14px 16px; }
.sec-title { font-size:9px; letter-spacing:0.3em; color:var(--accent); text-transform:uppercase; margin-bottom:14px; }
.row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
.row:last-child { margin-bottom:0; }
.row label { font-size:10px; letter-spacing:0.07em; color:var(--text-dim); white-space:nowrap; min-width:82px; }
.row .val { font-size:10px; color:#fff; min-width:36px; text-align:right; }
input[type=range] { flex:1; height:3px; -webkit-appearance:none; background:rgba(255,255,255,0.1); border-radius:2px; outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent); cursor:pointer; }
input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:var(--accent); border:none; }
.color-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.color-row label { font-size:10px; color:var(--text-dim); min-width:82px; }
input[type=color] { width:32px; height:22px; border:1px solid rgba(255,255,255,0.15); border-radius:3px; background:transparent; cursor:pointer; padding:1px; }
input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
input[type=color]::-webkit-color-swatch { border:none; border-radius:2px; }
.tgrp { display:flex; gap:5px; flex-wrap:wrap; }
.tog { font-size:9px; letter-spacing:0.07em; padding:4px 10px; border-radius:3px; border:1px solid rgba(255,255,255,0.12); color:var(--text-dim); cursor:pointer; transition:all 0.15s; font-family:var(--mono); background:transparent; text-transform:uppercase; }
.tog:hover { border-color:rgba(255,255,255,0.3); color:var(--text); }
.tog.on { background:var(--accent-glow); border-color:var(--accent); color:var(--accent); }
.preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.pbtn { font-size:9px; letter-spacing:0.07em; padding:7px 6px; border-radius:4px; border:1px solid rgba(255,255,255,0.1); color:var(--text-dim); cursor:pointer; text-align:center; text-transform:uppercase; transition:all 0.15s; background:rgba(255,255,255,0.03); font-family:var(--mono); }
.pbtn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }

#msgbox {
  display:none; position:fixed; top:64px; left:50%; transform:translateX(-50%);
  border-radius:6px; z-index:200; max-width:420px; line-height:1.9;
  text-align:center; font-family:var(--mono); font-size:11px;
  letter-spacing:0.06em; padding:16px 22px; pointer-events:all;
}
#msgbox.err  { background:rgba(20,4,4,0.97);  border:1px solid rgba(255,80,80,0.5);   color:#ff9090; }
#msgbox.info { background:rgba(4,10,24,0.97); border:1px solid rgba(80,140,255,0.5);  color:#90c8ff; }
#msgbox .close { cursor:pointer; color:rgba(255,255,255,0.3); font-size:10px; margin-top:10px; display:block; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">SPECTRUM STUDIO</span>
  <div class="divx"></div>
  <button class="src-btn" id="btn-mic">🎤 Microphone</button>
  <button class="src-btn" id="btn-tab">🖥 Tab Audio</button>
  <button class="src-btn" id="btn-demo">🎭 Demo</button>
  <div id="status-area">
    <div id="dot"></div>
    <span id="stxt">select a source</span>
  </div>
  <div class="divx"></div>
  <div id="panel-toggle">SETTINGS ▶</div>
</div>

<div id="canvas-wrap">
  <canvas id="cvs"></canvas>
</div>

<div id="panel">
  <div class="sec">
    <div class="sec-title">Presets</div>
    <div class="preset-grid">
      <button class="pbtn" onclick="applyPreset('default')">Default</button>
      <button class="pbtn" onclick="applyPreset('aurora')">Aurora</button>
      <button class="pbtn" onclick="applyPreset('inferno')">Inferno</button>
      <button class="pbtn" onclick="applyPreset('deep')">Deep Sea</button>
      <button class="pbtn" onclick="applyPreset('mono')">Mono</button>
      <button class="pbtn" onclick="applyPreset('neon')">Neon City</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-title">Audio</div>
    <div class="row"><label>Sensitivity</label><input type="range" id="r-sens" min="0.5" max="8" step="0.1" value="2"><span class="val" id="v-sens">2.0</span></div>
    <div class="row"><label>Smoothing</label><input type="range" id="r-smooth" min="0.5" max="0.98" step="0.01" value="0.82"><span class="val" id="v-smooth">0.82</span></div>
    <div class="row"><label>FFT Size</label>
      <div class="tgrp" id="fft-grp">
        <button class="tog" onclick="setFFT(1024,this)">1k</button>
        <button class="tog on" onclick="setFFT(2048,this)">2k</button>
        <button class="tog" onclick="setFFT(4096,this)">4k</button>
        <button class="tog" onclick="setFFT(8192,this)">8k</button>
      </div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-title">Bars</div>
    <div class="row"><label>Bar Count</label><input type="range" id="r-bars" min="16" max="256" step="4" value="120"><span class="val" id="v-bars">120</span></div>
    <div class="row"><label>Bar Gap</label><input type="range" id="r-gap" min="0" max="6" step="0.5" value="1"><span class="val" id="v-gap">1.0</span></div>
    <div class="row"><label>Rounding</label><input type="range" id="r-round" min="0" max="12" step="1" value="3"><span class="val" id="v-round">3</span></div>
    <div class="row"><label>Min Height</label><input type="range" id="r-minH" min="0" max="20" step="1" value="2"><span class="val" id="v-minH">2</span></div>
    <div class="row"><label>Max Height %</label><input type="range" id="r-maxH" min="10" max="100" step="1" value="45"><span class="val" id="v-maxH">45</span></div>
    <div class="row"><label>Mirror</label><div class="tgrp"><button class="tog on" id="tog-mirror" onclick="tog('mirror',this)">On</button></div></div>
    <div class="row"><label>Layout</label>
      <div class="tgrp" id="layout-grp">
        <button class="tog on" onclick="setLayout('center',this)">Center</button>
        <button class="tog" onclick="setLayout('bottom',this)">Bottom</button>
        <button class="tog" onclick="setLayout('top',this)">Top</button>
      </div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-title">Color</div>
    <div class="row"><label>Hue Shift</label><input type="range" id="r-hue" min="0" max="360" step="1" value="0"><span class="val" id="v-hue">0°</span></div>
    <div class="row"><label>Hue Spread</label><input type="range" id="r-spread" min="0" max="360" step="1" value="300"><span class="val" id="v-spread">300°</span></div>
    <div class="row"><label>Saturation</label><input type="range" id="r-sat" min="0" max="100" step="1" value="100"><span class="val" id="v-sat">100%</span></div>
    <div class="row"><label>Brightness</label><input type="range" id="r-bri" min="30" max="100" step="1" value="72"><span class="val" id="v-bri">72%</span></div>
    <div class="row"><label>Hue Speed</label><input type="range" id="r-hspeed" min="0" max="120" step="1" value="38"><span class="val" id="v-hspeed">38</span></div>
    <div class="row"><label>Gradient</label><div class="tgrp"><button class="tog on" id="tog-grad" onclick="tog('grad',this)">On</button></div></div>
    <div class="row"><label>Bg Fade</label><input type="range" id="r-bgfade" min="0.02" max="1" step="0.01" value="0.22"><span class="val" id="v-bgfade">0.22</span></div>
    <div class="color-row"><label>Bg Color</label><input type="color" id="c-bg" value="#000006"></div>
  </div>
  <div class="sec">
    <div class="sec-title">Glow Dots</div>
    <div class="row"><label>Enabled</label><div class="tgrp"><button class="tog on" id="tog-dots" onclick="tog('dots',this)">On</button></div></div>
    <div class="row"><label>Dot Size</label><input type="range" id="r-dotSize" min="1" max="12" step="0.5" value="3"><span class="val" id="v-dotSize">3.0</span></div>
    <div class="row"><label>Dot Boost</label><input type="range" id="r-dotBoost" min="0" max="8" step="0.5" value="4"><span class="val" id="v-dotBoost">4.0</span></div>
    <div class="row"><label>Both Ends</label><div class="tgrp"><button class="tog on" id="tog-dotsBoth" onclick="tog('dotsBoth',this)">On</button></div></div>
  </div>
  <div class="sec">
    <div class="sec-title">Waveform</div>
    <div class="row"><label>Enabled</label><div class="tgrp"><button class="tog on" id="tog-wave" onclick="tog('wave',this)">On</button></div></div>
    <div class="row"><label>Amplitude</label><input type="range" id="r-wamp" min="0.1" max="1" step="0.05" value="0.55"><span class="val" id="v-wamp">0.55</span></div>
    <div class="row"><label>Wave Speed</label><input type="range" id="r-wspeed" min="0.5" max="8" step="0.1" value="2.2"><span class="val" id="v-wspeed">2.2</span></div>
    <div class="row"><label>Line Width</label><input type="range" id="r-wwidth" min="0.5" max="5" step="0.5" value="1.5"><span class="val" id="v-wwidth">1.5</span></div>
    <div class="row"><label>Opacity</label><input type="range" id="r-wopac" min="0.05" max="1" step="0.05" value="0.45"><span class="val" id="v-wopac">0.45</span></div>
  </div>
  <div class="sec">
    <div class="sec-title">Peak Markers</div>
    <div class="row"><label>Enabled</label><div class="tgrp"><button class="tog" id="tog-peaks" onclick="tog('peaks',this)">Off</button></div></div>
    <div class="row"><label>Fall Speed</label><input type="range" id="r-peakfall" min="0.1" max="4" step="0.1" value="1.2"><span class="val" id="v-peakfall">1.2</span></div>
  </div>
</div>

<div id="msgbox">
  <span id="msgbody"></span>
  <span class="close" onclick="document.getElementById('msgbox').style.display='none'">✕ dismiss</span>
</div>

<script>
// ── Canvas ────────────────────────────────────────────────────────────────────
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let W = 1, H = 1;
function resize() {
  W = cvs.width  = cvs.offsetWidth  || 800;
  H = cvs.height = cvs.offsetHeight || 600;
}
resize();
window.addEventListener('resize', resize);

// ── Msg helper ────────────────────────────────────────────────────────────────
function msg(html, type) {
  document.getElementById('msgbody').innerHTML = html;
  const b = document.getElementById('msgbox');
  b.className = type; b.style.display = 'block';
}

// ── Audio state — one variable rules all ─────────────────────────────────────
// mode: 'off' | 'mic' | 'tab' | 'demo'
let mode = 'off';
let analyser = null, dataArr = null, bufLen = 1024;
let actx = null, mstream = null;
let fftSz = 2048;

function setSt(txt, cls) {
  document.getElementById('stxt').textContent = txt;
  document.getElementById('dot').className = cls;
}

function deactivateAllBtns() {
  ['btn-mic','btn-tab','btn-demo'].forEach(id => {
    const b = document.getElementById(id);
    b.classList.remove('active');
    b.disabled = false;
  });
  document.getElementById('btn-mic').textContent  = '🎤 Microphone';
  document.getElementById('btn-tab').textContent  = '🖥 Tab Audio';
  document.getElementById('btn-demo').textContent = '🎭 Demo';
}

function stopAudio() {
  if (mstream) { mstream.getTracks().forEach(t => t.stop()); mstream = null; }
  if (actx) { try { actx.close(); } catch(e){} actx = null; }
  analyser = null; dataArr = null;
  mode = 'off';
  deactivateAllBtns();
  setSt('select a source', '');
}

function hookStream(stream) {
  mstream = stream;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaStreamSource(stream);
  analyser = actx.createAnalyser();
  analyser.fftSize = fftSz;
  analyser.smoothingTimeConstant = s.smooth;
  src.connect(analyser);
  bufLen = analyser.frequencyBinCount;
  dataArr = new Uint8Array(bufLen);
}

// ── Microphone button ─────────────────────────────────────────────────────────
document.getElementById('btn-mic').onclick = async function() {
  if (mode === 'mic') { stopAudio(); return; }
  stopAudio();
  this.textContent = '⏳ asking...';
  document.getElementById('msgbox').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    hookStream(stream);
    mode = 'mic';
    deactivateAllBtns();
    document.getElementById('btn-mic').textContent = '⏹ Mic Live';
    document.getElementById('btn-mic').classList.add('active');
    setSt('mic live', 'on');
  } catch(e) {
    deactivateAllBtns();
    const n = e.name||'';
    setSt('error', 'err');
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError')
      msg('Mic permission blocked.<br>Click the 🔒 in the address bar → Allow microphone, then try again.<br><br>Or use <b>Tab Audio</b> or <b>Demo</b>.', 'err');
    else if (n === 'NotFoundError')
      msg('No microphone found on this device.', 'err');
    else
      msg('Mic unavailable: ' + (n||e.message) + '<br>Try <b>Tab Audio</b> or <b>Demo</b>.', 'err');
  }
};

// ── Tab Audio button ──────────────────────────────────────────────────────────
document.getElementById('btn-tab').onclick = async function() {
  if (mode === 'tab') { stopAudio(); return; }
  stopAudio();
  this.textContent = '⏳ pick tab...';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    deactivateAllBtns();
    msg('Tab audio requires Chrome or Edge.', 'err');
    return;
  }
  msg('Picker opening...<br><b style="color:#ffdd80">1.</b> Choose the tab playing music<br><b style="color:#ffdd80">2.</b> Tick <b style="color:#ffdd80">"Share tab audio"</b><br><b style="color:#ffdd80">3.</b> Click Share', 'info');
  try {
    const ds = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
    document.getElementById('msgbox').style.display = 'none';
    const atracks = ds.getAudioTracks();
    ds.getVideoTracks().forEach(t => t.stop()); // discard video
    if (atracks.length === 0) {
      deactivateAllBtns();
      setSt('no audio', 'err');
      msg('No audio captured.<br>You must tick <b style="color:#ffdd80">"Share tab audio"</b> before clicking Share.<br>Try again.', 'err');
      return;
    }
    hookStream(new MediaStream(atracks));
    mode = 'tab';
    atracks[0].addEventListener('ended', stopAudio);
    deactivateAllBtns();
    document.getElementById('btn-tab').textContent = '⏹ Tab Live';
    document.getElementById('btn-tab').classList.add('active');
    setSt('tab live', 'on');
  } catch(e) {
    document.getElementById('msgbox').style.display = 'none';
    deactivateAllBtns();
    const n = e.name||'';
    if (n !== 'NotAllowedError' && n !== 'AbortError' && !n.includes('abort'))
      msg('Tab audio error: ' + (n||e.message), 'err');
    setSt('cancelled', '');
  }
};

// ── Demo button ───────────────────────────────────────────────────────────────
document.getElementById('btn-demo').onclick = function() {
  if (mode === 'demo') { stopAudio(); return; }
  stopAudio();
  mode = 'demo';
  bufLen = 1024;
  deactivateAllBtns();
  this.textContent = '⏹ Demo Live';
  this.classList.add('active');
  setSt('demo', 'on');
  document.getElementById('msgbox').style.display = 'none';
};

let demoT = 0;
function getDemoData() {
  demoT += 0.04;
  const a = new Uint8Array(1024);
  for (let i = 0; i < 1024; i++) {
    const t = i/1024;
    const b = Math.max(0, Math.sin(demoT*1.3)*0.5+0.5);
    const m = Math.max(0, Math.sin(demoT*2.1+1)*0.4+0.4);
    const h = Math.max(0, Math.sin(demoT*3.7+2)*0.3+0.2);
    a[i] = Math.min(255, Math.floor(((t<0.15?b:t<0.5?m:h) + Math.random()*0.1)*210));
  }
  return a;
}

// ── Settings ──────────────────────────────────────────────────────────────────
const s = { sens:2, smooth:0.82, bars:120, gap:1, round:3, minH:2, maxH:45, hue:0, spread:300, sat:100, bri:72, hspeed:38, bgfade:0.22, bgColor:'#000006', dotSize:3, dotBoost:4, wamp:0.55, wspeed:2.2, wwidth:1.5, wopac:0.45, peakfall:1.2 };
const fl = { mirror:true, grad:true, dots:true, dotsBoth:true, wave:true, peaks:false };
let layout = 'center', peaks_ = new Array(120).fill(0), time = 0;

const FMT = { sens:v=>v.toFixed(1), smooth:v=>v.toFixed(2), gap:v=>v.toFixed(1), hue:v=>v+'°', spread:v=>v+'°', sat:v=>v+'%', bri:v=>v+'%', bgfade:v=>v.toFixed(2), dotSize:v=>parseFloat(v).toFixed(1), dotBoost:v=>parseFloat(v).toFixed(1), wamp:v=>v.toFixed(2), wspeed:v=>v.toFixed(1), wwidth:v=>v.toFixed(1), wopac:v=>v.toFixed(2), peakfall:v=>v.toFixed(1) };

document.querySelectorAll('input[type=range]').forEach(sl => {
  const key = sl.id.replace('r-','');
  const vl  = document.getElementById('v-'+key);
  sl.addEventListener('input', () => {
    s[key] = parseFloat(sl.value);
    if (vl) vl.textContent = FMT[key] ? FMT[key](s[key]) : s[key];
    if (key==='smooth' && analyser) analyser.smoothingTimeConstant = s[key];
    if (key==='bars') peaks_ = new Array(Math.ceil(s.bars)).fill(0);
  });
});
document.getElementById('c-bg').addEventListener('input', e => s.bgColor = e.target.value);

function tog(key, btn) {
  fl[key] = !fl[key];
  btn.textContent = fl[key]?'On':'Off';
  btn.classList.toggle('on', fl[key]);
  if (key==='peaks' && fl[key]) peaks_ = new Array(Math.ceil(s.bars)).fill(0);
}
function setLayout(l, btn) {
  layout = l;
  document.querySelectorAll('#layout-grp .tog').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
function setFFT(sz, btn) {
  fftSz = sz;
  document.querySelectorAll('#fft-grp .tog').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if (analyser) { analyser.fftSize = sz; bufLen = analyser.frequencyBinCount; dataArr = new Uint8Array(bufLen); }
}

const PRESETS = {
  default:{sens:2,smooth:0.82,bars:120,gap:1,round:3,minH:2,maxH:45,hue:0,spread:300,sat:100,bri:72,hspeed:38,bgfade:0.22,bgColor:'#000006',dotSize:3,dotBoost:4,wamp:0.55,wspeed:2.2,wwidth:1.5,wopac:0.45},
  aurora: {sens:2.2,smooth:0.88,bars:96,gap:1.5,round:6,minH:3,maxH:50,hue:140,spread:180,sat:100,bri:80,hspeed:20,bgfade:0.18,bgColor:'#00020a',dotSize:5,dotBoost:6,wamp:0.4,wspeed:1.5,wwidth:2,wopac:0.55},
  inferno:{sens:2.5,smooth:0.78,bars:140,gap:0.5,round:0,minH:1,maxH:42,hue:0,spread:80,sat:100,bri:65,hspeed:15,bgfade:0.28,bgColor:'#080000',dotSize:4,dotBoost:5,wamp:0.7,wspeed:3,wwidth:1,wopac:0.35},
  deep:   {sens:1.8,smooth:0.9,bars:80,gap:2,round:8,minH:4,maxH:38,hue:200,spread:60,sat:90,bri:60,hspeed:10,bgfade:0.15,bgColor:'#000308',dotSize:6,dotBoost:3,wamp:0.35,wspeed:1.2,wwidth:2.5,wopac:0.6},
  mono:   {sens:2,smooth:0.82,bars:160,gap:0.5,round:0,minH:1,maxH:48,hue:260,spread:0,sat:30,bri:85,hspeed:0,bgfade:0.3,bgColor:'#020202',dotSize:2,dotBoost:2,wamp:0.5,wspeed:2,wwidth:1,wopac:0.3},
  neon:   {sens:2.8,smooth:0.75,bars:200,gap:0.5,round:2,minH:2,maxH:52,hue:280,spread:200,sat:100,bri:75,hspeed:80,bgfade:0.35,bgColor:'#04000a',dotSize:4,dotBoost:7,wamp:0.65,wspeed:4,wwidth:1.5,wopac:0.5},
};
function applyPreset(name) {
  const p = PRESETS[name]; if (!p) return;
  Object.assign(s, p);
  for (const k of Object.keys(p)) {
    const sl = document.getElementById('r-'+k), vl = document.getElementById('v-'+k);
    if (sl) sl.value = p[k];
    if (vl) vl.textContent = FMT[k] ? FMT[k](p[k]) : p[k];
  }
  document.getElementById('c-bg').value = s.bgColor;
  if (analyser) analyser.smoothingTimeConstant = s.smooth;
  peaks_ = new Array(Math.ceil(s.bars)).fill(0);
}

// ── Panel toggle ──────────────────────────────────────────────────────────────
let panelOpen = true;
document.getElementById('panel-toggle').onclick = () => {
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('hidden', !panelOpen);
  document.getElementById('canvas-wrap').classList.toggle('full', !panelOpen);
  document.getElementById('panel-toggle').textContent = panelOpen ? 'SETTINGS ▶' : '◀ SETTINGS';
  setTimeout(resize, 320);
};

// ── Draw loop ─────────────────────────────────────────────────────────────────
function getFD() {
  if (mode==='demo') return getDemoData();
  if (mode!=='off' && analyser && dataArr) { analyser.getByteFrequencyData(dataArr); return dataArr; }
  return null;
}

function roundRect(x,y,w,h,r) {
  r = Math.min(r, w/2, h/2);
  if (r<=0) { ctx.fillRect(x,y,w,h); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath(); ctx.fill();
}

function draw() {
  requestAnimationFrame(draw);
  time += 0.016;

  // Background
  const hx = s.bgColor;
  const rgb = [parseInt(hx.slice(1,3),16), parseInt(hx.slice(3,5),16), parseInt(hx.slice(5,7),16)];
  ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${s.bgfade})`;
  ctx.fillRect(0,0,W,H);

  const fd   = getFD();
  const bars = Math.max(1, Math.floor(s.bars));
  const barW = W / bars;
  const maxH = H * (s.maxH/100);
  const cy   = layout==='center' ? H/2 : layout==='bottom' ? H-8 : 8;

  for (let i=0; i<bars; i++) {
    const idx = fd ? Math.min(Math.floor(i * bufLen / bars / 4), bufLen-1) : 0;
    const raw = fd ? fd[idx]/255 : 0;
    const val = Math.min(1, raw * s.sens);
    const bh  = Math.max(s.minH, val*maxH);
    const hue = (s.hue + (i/bars)*s.spread + time*s.hspeed) % 360;
    const x   = i * barW;
    const bw  = Math.max(1, barW - s.gap);

    // Color / gradient
    if (fl.grad) {
      const y0 = layout==='bottom' ? cy-bh : cy-bh;
      const y1 = layout==='top'    ? cy+bh : cy+bh;
      const g  = ctx.createLinearGradient(0, y0, 0, y1);
      if (layout==='center') {
        g.addColorStop(0,    `hsla(${hue+60},${s.sat}%,${Math.min(100,s.bri+15)}%,0.95)`);
        g.addColorStop(0.45, `hsla(${hue},${s.sat}%,${s.bri}%,0.6)`);
        g.addColorStop(1,    `hsla(${hue-40},${s.sat}%,${Math.max(0,s.bri-25)}%,0.08)`);
      } else if (layout==='bottom') {
        g.addColorStop(0, `hsla(${hue+60},${s.sat}%,${Math.min(100,s.bri+15)}%,0.95)`);
        g.addColorStop(1, `hsla(${hue},${s.sat}%,${Math.max(0,s.bri-20)}%,0.2)`);
      } else {
        g.addColorStop(0, `hsla(${hue},${s.sat}%,${Math.max(0,s.bri-20)}%,0.2)`);
        g.addColorStop(1, `hsla(${hue+60},${s.sat}%,${Math.min(100,s.bri+15)}%,0.95)`);
      }
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = `hsla(${hue},${s.sat}%,${s.bri}%,0.85)`;
    }

    if (layout==='center') {
      roundRect(x, cy-bh, bw, bh, s.round);
      if (fl.mirror) roundRect(x, cy, bw, bh, s.round);
    } else if (layout==='bottom') {
      roundRect(x, cy-bh, bw, bh, s.round);
    } else {
      roundRect(x, cy, bw, bh, s.round);
    }

    // Peaks
    if (fl.peaks) {
      if (!peaks_[i]) peaks_[i]=0;
      if (val*maxH > peaks_[i]) peaks_[i] = val*maxH;
      else peaks_[i] = Math.max(0, peaks_[i] - s.peakfall*0.5);
      ctx.fillStyle = `hsla(${hue+80},${s.sat}%,92%,0.9)`;
      if (layout==='center') {
        ctx.fillRect(x, cy-peaks_[i]-2, bw, 2);
        if (fl.mirror) ctx.fillRect(x, cy+peaks_[i], bw, 2);
      } else if (layout==='bottom') { ctx.fillRect(x, cy-peaks_[i]-2, bw, 2); }
      else { ctx.fillRect(x, cy+peaks_[i], bw, 2); }
    }

    // Glow dots
    if (fl.dots) {
      const dr = s.dotSize + val*s.dotBoost;
      ctx.fillStyle = `hsla(${hue+80},${s.sat}%,92%,${0.4+val*0.6})`;
      if (layout==='center') {
        ctx.beginPath(); ctx.arc(x+bw/2, cy-bh, dr, 0, Math.PI*2); ctx.fill();
        if (fl.dotsBoth && fl.mirror) { ctx.beginPath(); ctx.arc(x+bw/2, cy+bh, dr, 0, Math.PI*2); ctx.fill(); }
      } else if (layout==='bottom') {
        ctx.beginPath(); ctx.arc(x+bw/2, cy-bh, dr, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x+bw/2, cy+bh, dr, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // Waveform
  if (fl.wave && fd) {
    ctx.beginPath();
    for (let i=0; i<W; i++) {
      const idx = Math.min(Math.floor(i/W * bufLen/4), bufLen-1);
      const v   = (fd[idx]/255 * s.sens - 0.5);
      const amp = maxH * s.wamp * (layout==='center'?1:0.5);
      const y   = cy + v*amp + Math.sin(i*0.016 + time*s.wspeed)*8;
      i===0 ? ctx.moveTo(i,y) : ctx.lineTo(i,y);
    }
    ctx.strokeStyle = `hsla(${(s.hue+time*s.hspeed*0.5)%360},${s.sat}%,82%,${s.wopac})`;
    ctx.lineWidth = s.wwidth; ctx.stroke();
  }
}

draw();
</script>
